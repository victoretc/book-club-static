<header class="header">
  <div class="header-inner">
    <a href="{{ relURL "" }}" class="header-brand">Читальная</a>

    <nav class="header-nav">
      <a href="{{ relURL "clubs/" }}" class="header-nav-link{{ if .IsSection }} active{{ end }}">
        <svg class="header-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/>
        </svg>
        Клубы
      </a>
      <a href="{{ relURL "add-book/" }}" class="header-nav-link{{ if eq .Section "add-book" }} active{{ end }}">
        <svg class="header-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14"/>
          <path d="M12 5v14"/>
        </svg>
        Добавить книгу
      </a>
    </nav>
  </div>
