{{- define "main" -}}
<div class="not-found">
  <h1 class="not-found-title">Страница не найдена</h1>
  <p class="not-found-text">Похоже, такой страницы не существует или она была перемещена.</p>
  <img src="{{ "not-found.png" | relURL }}" alt="Страница не найдена" class="not-found-img">
  <a href="{{ "/" | relURL }}" class="base-btn base-btn--primary">На главную</a>
</div>
{{- end -}}
