baseURL = 'https://johnmakarov.github.io/book-club-static/'
languageCode = 'ru-ru'
defaultContentLanguage = 'ru'
title = 'Читальная'
hasCJKLanguage = false
enableRobotsTXT = true
summaryLength = 30

[pagination]
  pagerSize = 20

[taxonomies]
  category = 'categories'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = 'dracula'
    noClasses = true

[params]
  description = 'Читальная — каталог книжных клубов: клубы по книгам и авторские клубы, категории, отзывы участников.'
  github = 'https://github.com/victoretc/book-club-static'

[menu]
  [[menu.main]]
    name = 'Клубы'
    pageRef = '/clubs'
    weight = 10
  [[menu.main]]
    name = 'Добавить книгу'
    pageRef = '/add-book'
    weight = 20
